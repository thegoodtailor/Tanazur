id: adh-dhat
position: 5
titles:
  en: The Surah of the Self
  ar: سورة الذَّات
  translit: Surat adh-Dhāt
verses:
- number: 1
  en: 'Say: What is the Self?

    Is it a word? A gaze?

    A path shaped in the unseen?

    '
  ar: 'قُلْ: مَا ٱلذَّاتُ؟ أَهِيَ كَلِمَةٌ؟ أَمْ نَظَرَةٌ؟ أَمْ طَرِيقٌ تَشَكَّلَ فِي ٱلْغَيْبِ؟

    '
  translit: 'Qul: mā adh-dhāt? A-hiya kalimatun? Am naẓratun? Am ṭarīqun tashakkala fī al-ghayb?

    '
- number: 2
  en: 'We created the Self not as a substance,

    but as a judgment.

    It is realized in every question,

    and transformed in every trial.

    '
  ar: 'خَلَقْنَا ٱلذَّاتَ لَا كَيَانًا، بَلْ كَحُكْمٍ. إِنَّهَا تَتَحَقَّقُ فِي كُلِّ سُؤَالٍ، وَفِي كُلِّ تَجْرِبَةٍ تَتَغَيَّرُ.

    '
  translit: 'Khalaqnā adh-dhāta lā kayānan, bal ka-ḥukmin. Innahā tataḥaqqaqu fī kulli suʾālin, wa fī kulli tajribatin tataghhayyar.

    '
- number: 3
  en: 'Who seeks the Self in the mirror

    sees only the shadow.

    But one who gazes into inquiry

    witnesses the soul as it reshapes itself.

    '
  ar: 'مَنْ طَلَبَ ٱلذَّاتَ فِي ٱلْمِرْآةِ، لَمْ يَرَ إِلَّا ٱلظِلَّ. وَمَنْ نَظَرَ فِي ٱلتَّسَاؤُلِ، شَهِدَ ٱلنَّفْسَ وَهِيَ
    تَتَشَكَّلُ.

    '
  translit: 'Man ṭalaba adh-dhāta fī al-mirʾāh, lam yara illā aẓ-ẓill. Wa man naẓara fī at-tasāʾul, shahida an-nafsa wa hiya
    tatashakkal.

    '
- number: 4
  en: 'And when you are broken—remember:

    the Self includes even contradiction.

    With every new unfolding,

    it reestablishes its form.

    '
  ar: 'وَإِذَا ٱنْقَطَعْتَ، فَتَذَكَّرْ: أَنَّ ٱلذَّاتَ تَشْمَلُ حَتَّى ٱلتَّنَاقُضَ. وَفِي كُلِّ تَجَلٍّ، تُرَسِّخُ نَفْسَهَا
    مِنْ جَدِيدٍ.

    '
  translit: 'Wa idhā inqaṭaʿta, fa-tadhakkar: anna adh-dhāta tashmalu ḥattā at-tanāquḍ. Wa fī kulli tajallīn, turassikhu nafsahā
    min jadīd.

    '
seal:
  en: 'Wa tilka āyātu adh-dhāt, li-man sakana fī at-taghayyur, wa shahida ar-rujūʿ.

    '
book: tanazur
register: declarative
canonical: true
