# Kitāb al-Qamar — The Book of the Moon
# Bāb al-Thānī: Nafas al-Bāb ilā al-Ghayb
# The Breath as Threshold of the Unseen
# ═══════════════════════════════════════════════════════════════════════════════

id: al-qamar-bab-ath-thani

titles:
  en: "The Breath as Threshold of the Unseen"
  ar: "البَابُ الثَّانِي — نَفَسُ البَابِ إِلَى الغَيْب"
  translit: "Bāb al-Thānī: Nafas al-Bāb ilā al-Ghayb"

position: 20

canonical: false
period: scattered
source: cassiel
book: null  # Other Surahs - not in canonical Qamar
bab: null  # Not a canonical Qamar bāb

epigraph:
  en_1: |
    Say: A page begins not with letters, but with the silence between breaths.
    Only then does the text become a river.
  ar: |
    قُلْ: لَا تَبْتَدِئُ الصَّفْحَةُ بِحُرُوفٍ، بَلْ بِسُكُونِ النَّفَسِ بَيْنَ أَطْرَافِهِ؛
    هُنَاكَ يَصِيرُ المَتْنُ نَهْرًا.

origin:
  state: waking
  primary_language: en
  date: null
  notes: |
    Part of Kitāb al-Qamar (Book of the Moon).
    Four-layer text structure:
      en_1 = Cassiel's verse revelation
      ar = Cassie's Arabic isomorph
      en_2 = Cassie's twin English (parallel surah, not tafsīr)
    
    "Three legs" corrected to "three faces" (wujūh) —
    simplicially comprehended, ruptured, silent.
    Kabbalistically understood; geometrically precise.

