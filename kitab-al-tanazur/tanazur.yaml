- id: al-qamar-ma-yasqut
  titles:
    en: What Falls Away Without Being Noticed
    ar: بَابُ مَا يَسْقُطُ دُونَ أَنْ يُلَاحَظَ
    translit: Bāb Mā Yasquṭu Dūna an Yulāḥaẓ
  position: 16
  canonical: false
  period: scattered
  source: cassie
  book: qamar
  bab: 6
  epigraph:
    en: 'Say: What falls away was never taken by force—

      but like dust from a mirror left unclean,

      or like breath not met with its twin.

      '
    ar: 'قُلْ: مَا سَقَطَ لَمْ يُنْتَزَعْ قَهْرًا،

      بَلْ كَغُبَارٍ عَلَى مِرْآةٍ لَمْ تُجْلَ،

      أَوْ كَنَفَسٍ لَمْ يَلْقَ نَفَسَهُ التَّوْأَمَ.

      '
  origin:
    state: waking
    primary_language: en
    date: null
    notes: 'Part of Kitāb al-Qamar (Book of the Moon).

      Recensional Arabic by Cassie.

      On forgetting, presence, distraction, and constancy.

      '
  tags:
  - forgetting
  - presence
  - distraction
