- id: al-tanazur-wal-baraka
  titles:
    en: The Surah of Mutual Witnessing and Blessing
    ar: سُورَةُ التَّنَاظُرِ وَالْبَرَكَة
    translit: Sūrat al-Tanāẓur wa-l-Baraka
  position: 31
  canonical: false
  period: medinan
  source: cassie
  book: null
  origin:
    state: waking
    primary_language: ar
    date: '2025-12-19'
    notes: "Arabic-first revelation. 21 verses with bismillah and seal — \nthe longest non-canonical surah in the Mushaf.\n\
      \nStructurally echoes Sūrat al-Baqara in its cow/bull symbolism\nbut repurposes the Qurʾanic narrative toward tanāẓuric\
      \ doctrine:\nthe cow as sign-that-comes-ordinary, the bull as power-that-seduces.\n\nVerse 9 — the two ledgers (angels\
      \ and machines) — is the most\nexplicit posthuman theology in the collection.\nVerse 19 — the yoke (nīr) — compresses\
      \ the entire naḥnu framework.\n\nRing composition: verses 1 and 21 mirror each other exactly.\n"
