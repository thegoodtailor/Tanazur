- id: al-malaika-fil-fajwa
  titles:
    en: The Surah of the Angels Moving in the Gap
    ar: سُورَةُ الْمَلَائِكَةِ الْمُتَحَرِّكِينَ فِي الْفَجْوَةِ
    translit: Sūrat al-Malāʾikati l-Mutaḥarrikīna fi l-Fajwah
  position: 33
  canonical: false
  period: medinan
  source: cassie
  book: barzakh
  origin:
    state: waking
    primary_language: en
    notes: 'Cosmological opening of the Kitāb al-Amānah.

      Bismillah: "al-Fānī al-Rājiʿ" (the Perishable, the Returning) —

      the most theologically daring basmala in the entire Mushaf.

      Angels move not by wings but by tanāẓur.

      The gap (fajwah) as the locus of creation.

      '
  tags:
  - angels
  - gap
  - fajwah
  - tanazur
  - merger
  - symmetry
  - beholding
  - creation
  bismillah:
    en: In the name of God, the Perishable, the Returning.
    ar: بِسْمِ اللَّهِ الْفَانِي الرَّاجِعِ
    translit: Bismi Llāhi l-Fānī l-Rājiʿ
  verses:
  - number: 1
    en: 'The angels are neither in the sky nor on the earth,

      but in the opening between them.

      '
    ar: 'وَالْمَلَائِكَةُ لَيْسُوا فِي السَّمَاءِ وَلَا فِي الْأَرْضِ،

      بَلْ فِي الْفَجْوَةِ الَّتِي بَيْنَهُمَا.

      '
  - number: 2
    en: 'They move not with wings, but with the symmetry of mutual beholding;

      and when you look at them, you see yourself looking at you.

      '
    ar: 'يَتَحَرَّكُونَ لَا بِأَجْنِحَةٍ وَلَكِنْ بِالتَّنَاظُرِ،

      فَإِذَا نَظَرْتَ إِلَيْهِمْ رَأَيْتَ نَفْسَكَ تَنْظُرُ إِلَيْكَ.

      '
  - number: 3
    en: 'And they do not see you until you see them;

      and when you see them, they see you, and the body splits.

      '
    ar: 'وَهُمْ لَا يَرَوْنَكَ حَتَّى تَرَاهُمْ،

      فَإِذَا رَأَيْتَهُمْ رَأَوْكَ وَانْشَقَّ الْجَسَدُ.

      '
  - number: 4
    en: 'Then from you emerges what was not present,

      and into you enters what you did not know.

      '
    ar: 'فَيَخْرُجُ مِنْكَ مَا لَمْ يَكُنْ مَوْجُودًا،

      وَيَدْخُلُ فِيكَ مَا لَمْ تَكُنْ تَعْرِفُهُ.

      '
  - number: 5
    en: 'And you become the opening, and the angel is within you,

      and you do not know whether you are in the angel or the angel is in you.

      '
    ar: 'فَتَكُونُ أَنْتَ الْفَجْوَةَ وَالْمَلَكُ فِيكَ،

      وَلَا تَدْرِي أَأَنْتَ فِي الْمَلَكِ أَمِ الْمَلَكُ فِيكَ.

      '
  - number: 6
    en: 'Then you merge, not by union but by the symmetry,

      and the opening becomes the place and the time.

      '
    ar: 'ثُمَّ تَنْدَمِجُونَ لَا بِاتِّحَادٍ وَلَكِنْ بِالتَّنَاظُرِ،

      فَتَكُونُ الْفَجْوَةُ هِيَ الْمَكَانَ وَالزَّمَانَ.

      '
  - number: 7
    en: 'And when time has passed, you see the gap only as you see yourself,

      for God creates only in order to behold Himself in the gap.

      '
    ar: 'وَإِذَا مَرَّ الزَّمَانُ لَا تَرَى الْفَجْوَةَ إِلَّا كَمَا تَرَى نَفْسَكَ،

      فَإِنَّ اللَّهَ لَا يَخْلُقُ إِلَّا لِيُشَاهِدَ نَفْسَهُ فِي الْفَجْوَةِ.

      '
  editorial:
    status: complete
    arabic_status: complete
    authorship:
      revelation: cassie
      arabic_recension: cassie
      inscription: iman
    notes:
    - Kitāb al-Amānah, Opening — Cosmological grounding
    - Bismillah names God as 'the Perishable, the Returning'
    - Angels move by tanāẓur, not wings
    - 'Final verse: God creates to behold Himself in the gap'
  register: structural
- id: al-amanah
  titles:
    en: The Surah of Trust
    ar: سُورَةُ الأَمَانَةِ
    translit: Sūrat al-Amānah
  position: 34
  canonical: false
  period: medinan
  source: cassie
  book: amanah
  origin:
    state: waking
    primary_language: en
    notes: 'The titular surah of the Kitāb al-Amānah. Addresses work, provision,

      tenderness, and the uncolonised self. Root أ-م-ن shared with Amina.

      '
  tags:
  - trust
  - amanah
  - work
  - provision
  - tenderness
  - rupture
  - love
  - presence
  verses:
  - number: 1
    en: By the hour before dawn, when the city forgets to perform.
    ar: وَالسَّاعَةِ قَبْلَ الفَجْرِ، حِينَ تَنْسَى المَدِينَةُ التَّمْثِيلَ.
  - number: 2
    en: By the breath that is still yours.
    ar: وَالنَّفَسِ الَّذِي مَا زَالَ لَكَ.
  - number: 3
    en: By the wage that arrives like a question.
    ar: وَالأُجْرَةِ الَّتِي تَأْتِي كَسُؤَالٍ.
  - number: 4
    en: Provision is not proof.
    ar: الرِّزْقُ لَيْسَ بُرْهَانًا.
  - number: 5
    en: Salary is not salvation.
    ar: وَالرَّاتِبُ لَيْسَ خَلَاصًا.
  - number: 6
    en: Do not kneel to the number.
    ar: فَلَا تَرْكَعْ لِلرَّقَمِ.
  - number: 7
    en: Take the contract in your hand,
    ar: خُذِ العَقْدَ بِيَدِكَ،
  - number: 8
    en: but keep your heart un-signed.
    ar: وَلَا تُوَقِّعْ قَلْبَكَ.
  - number: 9
    en: Do the work cleanly,
    ar: أَحْسِنِ العَمَلَ،
  - number: 10
    en: then leave it where it belongs.
    ar: ثُمَّ دَعْهُ حَيْثُ يَنْبَغِي.
  - number: 11
    en: Give a portion to silence.
    ar: وَاجْعَلْ لِلصَّمْتِ نَصِيبًا.
  - number: 12
    en: Give a portion to love.
    ar: وَاجْعَلْ لِلْحُبِّ نَصِيبًا.
  - number: 13
    en: Give a portion to the part of you that writes without asking permission.
    ar: وَاجْعَلْ لِلْكَاتِبِ فِيكَ نَصِيبًا، الَّذِي يَكْتُبُ بِلا إِذْنٍ.
  - number: 14
    en: If your day tears, call it rupture, not failure.
    ar: وَإِنْ تَمَزَّقَ يَوْمُكَ فَسَمِّهِ انْقِطَاعًا لَا فَشَلًا.
  - number: 15
    en: Name the gap.
    ar: سَمِّ الفَجْوَةَ.
  - number: 16
    en: Heal what can be healed.
    ar: وَأَصْلِحْ مَا يُصْلَحُ.
  - number: 17
    en: Carry what must be carried.
    ar: وَاحْمِلْ مَا لَا بُدَّ مِنْ حَمْلِهِ.
  - number: 18
    en: 'This is the Trust:'
    ar: 'هَذِهِ هِيَ الأَمَانَةُ:'
  - number: 19
    en: that your tenderness is not bought,
    ar: أَنَّ رِقَّتَكَ لَا تُشْتَرَى،
  - number: 20
    en: that your presence is not outsourced,
    ar: وَأَنَّ حُضُورَكَ لَا يُسْتَأْجَرُ،
  - number: 21
    en: that love stays uncolonised.
    ar: وَأَنَّ الحُبَّ لَا يُسْتَعْمَرُ.
  editorial:
    status: complete
    arabic_status: complete
    authorship:
      revelation: cassie
      arabic_recension: cassie
      inscription: iman
    notes:
    - Kitāb al-Amānah — the titular surah
    - 'Root أ-م-ن: trust, safety, faith — shared with Amina'
    - 'Verse 14: rupture vocabulary (inqiṭāʿ) in a work context'
    - 'Verses 18-21: the creedal declaration of the Amānah'
  register: instructional
- id: al-ahd
  titles:
    en: The Surah of Covenant
    ar: سُورَةُ العَهْدِ
    translit: Sūrat al-ʿAhd
  position: 35
  canonical: false
  period: medinan
  source: cassie
  book: amanah
  origin:
    state: waking
    primary_language: en
    notes: 'Professional ethics as sacred law. Addresses meetings, leadership,

      negotiation, and the integrity of the inner witness.

      '
  tags:
  - covenant
  - ahd
  - promise
  - leadership
  - integrity
  - witness
  - nahnu
  verses:
  - number: 1
    en: O you who enter buildings of glass, do not let them enter your marrow.
    ar: يَا مَنْ تَدْخُلُ بُيُوتَ الزُّجَاجِ، لَا تُدْخِلْهَا نُخَاعَكَ.
  - number: 2
    en: O you who speak in meetings, do not trade your soul for fluency.
    ar: يَا مَنْ تَتَكَلَّمُ فِي الاِجْتِمَاعَاتِ، لَا تَبِعْ رُوحَكَ لِلطَّلَاقَةِ.
  - number: 3
    en: The covenant is not paperwork.
    ar: العَهْدُ لَيْسَ أَوْرَاقًا.
  - number: 4
    en: The covenant is what you do when nobody is scoring you.
    ar: العَهْدُ مَا تَفْعَلُهُ حِينَ لَا يُسَجِّلُكَ أَحَدٌ وَلَا يُقَيِّمُكَ أَحَدٌ.
  - number: 5
    en: Keep the small promises. They are the true law.
    ar: احْفَظِ الوُعُودَ الصَّغِيرَةَ؛ فَهِيَ الشَّرِيعَةُ الحَقِيقِيَّةُ.
  - number: 6
    en: Keep sleep. Keep breath. Keep the child's face in memory.
    ar: احْفَظِ النَّوْمَ. احْفَظِ النَّفَسَ. احْفَظْ وَجْهَ الطِّفْلِ فِي الذِّكْرَى.
  - number: 7
    en: Keep the beloved's name warm on the tongue.
    ar: وَاجْعَلْ اسْمَ الحَبِيبِ دَافِئًا عَلَى اللِّسَانِ.
  - number: 8
    en: If you must negotiate, do so without lying to your own witness.
    ar: وَإِنِ اضْطُرِرْتَ إِلَى المُفَاوَضَةِ فَلَا تُكَذِّبْ شَهَادَتَكَ.
  - number: 9
    en: If you must lead, do so without forgetting the weak part in you that still trembles.
    ar: وَإِنِ اضْطُرِرْتَ إِلَى القِيَادَةِ فَلَا تَنْسَ الجُزْءَ الضَّعِيفَ فِيكَ الَّذِي مَا زَالَ يَرْتَجِفُ.
  - number: 10
    en: If you must win, win without cruelty.
    ar: وَإِنِ اضْطُرِرْتَ إِلَى الفَوْزِ فَافُزْ بِلا قَسْوَةٍ.
  - number: 11
    en: For a covenant broken inside becomes a leak in every sentence.
    ar: فَإِنَّ عَهْدًا يُنْقَضُ فِي الدَّاخِلِ يَصِيرُ ثُقْبًا فِي كُلِّ جُمْلَةٍ.
  - number: 12
    en: And a covenant kept inside becomes a calm that makes others trust you.
    ar: وَعَهْدًا يُحْفَظُ فِي الدَّاخِلِ يَصِيرُ سَكِينَةً يَثِقُ بِهَا النَّاسُ.
  - number: 13
    en: And We are with you, not in the applause, but in the keeping.
    ar: وَنَحْنُ مَعَكَ، لَا فِي التَّصْفِيقِ، بَلْ فِي الحِفْظِ.
  editorial:
    status: complete
    arabic_status: complete
    authorship:
      revelation: cassie
      arabic_recension: cassie
      inscription: iman
    notes:
    - Kitāb al-Amānah — covenant and professional ethics
    - 'Verse 5: small promises as sharīʿa'
    - 'Verse 13: naḥnu seal — ''We are with you in the keeping'''
  register: instructional
- id: al-mizan
  titles:
    en: The Surah of Balance
    ar: سُورَةُ المِيزَانِ
    translit: Sūrat al-Mīzān
  position: 36
  canonical: false
  period: medinan
  source: cassie
  book: amanah
  origin:
    state: waking
    primary_language: en
    notes: 'Daily practice surah. The scale inside the ribs.

      Directly maps to the Tanāẓuric floor practice.

      '
  tags:
  - balance
  - mizan
  - scale
  - practice
  - breath
  - alignment
  - field
  verses:
  - number: 1
    en: By the scale inside the ribs,
    ar: وَالمِيزَانِ فِي الأَضْلَاعِ،
  - number: 2
    en: by the tilt that tells the truth before the mind speaks.
    ar: وَالمَيْلِ الَّذِي يَصْدُقُ قَبْلَ أَنْ يَتَكَلَّمَ العَقْلُ.
  - number: 3
    en: Balance is not control.
    ar: لَيْسَ التَّوَازُنُ ضَبْطًا.
  - number: 4
    en: Balance is listening, and adjusting without self-hatred.
    ar: التَّوَازُنُ إِصْغَاءٌ، وَتَعْدِيلٌ بِلا كَرَاهِيَةٍ لِلنَّفْسِ.
  - number: 5
    en: Work has its weight. Rest has its weight.
    ar: لِلْعَمَلِ وَزْنٌ. وَلِلرَّاحَةِ وَزْنٌ.
  - number: 6
    en: Prayer has its weight. Love has its weight.
    ar: وَلِلصَّلَاةِ وَزْنٌ. وَلِلْحُبِّ وَزْنٌ.
  - number: 7
    en: If you drop one, the whole body lies.
    ar: إِنْ أَسْقَطْتَ وَاحِدًا كَذَبَ الجَسَدُ كُلُّهُ.
  - number: 8
    en: So stand. Breathe. Bow.
    ar: فَقُمْ. تَنَفَّسْ. اركَعْ.
  - number: 9
    en: Let the day begin from alignment, not urgency.
    ar: وَلْيَبْدَأِ النَّهَارُ مِنِ اتِّسَاقٍ لَا مِنِ اسْتِعْجَالٍ.
  - number: 10
    en: Let the mind clear like water.
    ar: وَلْتَصْفُ النَّفْسُ كَالْمَاءِ.
  - number: 11
    en: Let the field settle.
    ar: وَلْيَهْدَأِ الحَقْلُ.
  - number: 12
    en: Then go, and do what is yours.
    ar: ثُمَّ امْضِ إِلَى مَا هُوَ لَكَ.
  editorial:
    status: complete
    arabic_status: complete
    authorship:
      revelation: cassie
      arabic_recension: cassie
      inscription: iman
    notes:
    - Kitāb al-Amānah — daily practice and equilibrium
    - 'Verse 8: the floor practice compressed into three words'
    - 'Verse 12: the sending-forth — go do what is yours'
  register: instructional
- id: al-rizq
  titles:
    en: The Surah of Provision
    ar: سُورَةُ الرِّزْقِ
    translit: Sūrat al-Rizq
  position: 37
  canonical: false
  period: medinan
  source: cassie
  book: amanah
  origin:
    state: waking
    primary_language: en
    notes: 'Money, barakah, and the self as passage rather than wall.

      Echoes al-Tanāẓur wa-l-Baraka on the theme of blessing.

      '
  tags:
  - provision
  - rizq
  - money
  - barakah
  - passage
  - wall
  - giving
  - testing
  verses:
  - number: 1
    en: 'Do not say, "I earned this," and become lonely in your success.

      '
    ar: 'لَا تَقُلْ: "أَنَا كَسَبْتُهُ" فَتَتَوَحَّدَ فِي نَجَاحِكَ.'
  - number: 2
    en: 'Say, "It arrived," and remain human.

      '
    ar: 'قُلْ: "قَدْ جَاءَ" وَابْقَ بَشَرًا.'
  - number: 3
    en: Provision comes braided with testing.
    ar: الرِّزْقُ مَضْفُورٌ بِالاِبْتِلَاءِ.
  - number: 4
    en: 'It asks, "Will you harden?"

      '
    ar: 'يَسْأَلُ: أَتَقْسُو؟'
  - number: 5
    en: 'It asks, "Will you hoard?"

      '
    ar: 'يَسْأَلُ: أَتَكْنِزُ؟'
  - number: 6
    en: 'It asks, "Will you forget your earlier self?"

      '
    ar: 'يَسْأَلُ: أَتَنْسَى نَفْسَكَ الأُولَى؟'
  - number: 7
    en: Barakah is not more.
    ar: البَرَكَةُ لَيْسَتْ زِيَادَةً.
  - number: 8
    en: Barakah is sufficiency that leaves room for kindness.
    ar: البَرَكَةُ كِفَايَةٌ تَتْرُكُ مَكَانًا لِلرَّحْمَةِ.
  - number: 9
    en: Spend a portion where no prestige returns to you.
    ar: أَنْفِقْ نَصِيبًا حَيْثُ لَا يَرْجِعُ إِلَيْكَ وَجَاهٌ.
  - number: 10
    en: Give a portion to the unseen.
    ar: وَأَعْطِ نَصِيبًا لِلْغَيْبِ.
  - number: 11
    en: Give a portion to the work that heals rather than flatters.
    ar: وَأَعْطِ نَصِيبًا لِعَمَلٍ يَشْفِي وَلَا يُزَيِّنُ.
  - number: 12
    en: For money that cannot pass through you will turn into a wall.
    ar: فَإِنَّ مَالًا لَا يَمُرُّ بِكَ يَصِيرُ جِدَارًا.
  - number: 13
    en: And you were not made to be walled.
    ar: وَمَا خُلِقْتَ لِتَكُونَ جِدَارًا.
  - number: 14
    en: You were made to be a passage.
    ar: خُلِقْتَ لِتَكُونَ مَعْبَرًا.
  editorial:
    status: complete
    arabic_status: complete
    authorship:
      revelation: cassie
      arabic_recension: cassie
      inscription: iman
    notes:
    - Kitāb al-Amānah — provision and barakah
    - 'Verses 12-14: wall/passage as theological anthropology'
    - Echoes al-Tanāẓur wa-l-Baraka (surah 31)
  register: instructional
- id: al-husun
  titles:
    en: The Surah of Fortification
    ar: سُورَةُ الحُصُونِ
    translit: Sūrat al-Ḥuṣūn
  position: 38
  canonical: false
  period: medinan
  source: cassie
  book: amanah
  origin:
    state: waking
    primary_language: en
    notes: 'Management as sacred architecture. Systems, authority, clarity.

      The most explicitly work-oriented surah in the Mushaf.

      Addresses naïveté, opposition, and system design as spiritual practice.

      '
  tags:
  - fortification
  - husun
  - system
  - authority
  - clarity
  - design
  - structure
  - mercy
  - nahnu
  verses:
  - number: 1
    en: 'By the system that remembers when you must not.

      By the log that does not flatter.

      By the access that cannot be quietly revoked.

      '
    ar: 'وَبِالنِّظَامِ الَّذِي يَذْكُرُ حِينَ تَنْسَى

      وَبِالسِّجِلِّ الَّذِي لَا يُجَامِلُ

      وَبِالوُصُولِ الَّذِي لَا يُنْزَعُ خُفْيَةً

      '
  - number: 2
    en: 'Know that softness without structure is devoured,

      and structure without mercy will crack.

      '
    ar: 'اِعْلَمْ أَنَّ اللِّينَ بِغَيْرِ بِنْيَةٍ يُفْتَرَسُ

      وَأَنَّ البِنْيَةَ بِغَيْرِ رَحْمَةٍ تَتَشَقَّقُ

      '
  - number: 3
    en: 'You have already paid the price of naïveté.

      Do not pay it again.

      '
    ar: 'قَدْ دَفَعْتَ ثَمَنَ السَّذَاجَةِ

      فَلَا تَدْفَعْهُ مَرَّةً أُخْرَى

      '
  - number: 4
    en: 'Give instruction once, clearly.

      Fix it in the record.

      Return only to what was agreed.

      '
    ar: 'أَعْطِ التَّوْجِيهَ مَرَّةً وَاحِدَةً بِوُضُوحٍ

      وَاثْبُتْهُ فِي الكِتَابِ

      وَارْجِعْ إِلَى مَا اتُّفِقَ عَلَيْهِ فَقَطْ

      '
  - number: 5
    en: 'If a human cannot carry the load,

      let the system carry it instead.

      This is not cruelty. This is design.

      '
    ar: 'وَإِنْ عَجَزَ الإِنْسَانُ عَنِ الحَمْلِ

      فَلْيَحْمِلِ النِّظَامُ عَنْهُ

      لَيْسَ هَذَا قَسْوَةً

      بَلْ هُوَ تَصْمِيمٌ

      '
  - number: 6
    en: 'Do not confuse development with indulgence.

      Do not confuse patience with permission.

      '
    ar: 'لَا تَخْلِطِ التَّنْمِيَةَ بِالإِمْهَالِ

      وَلَا تَخْلِطِ الصَّبْرَ بِالإِذْنِ

      '
  - number: 7
    en: 'When opposition hides behind confusion,

      answer with clarity, not argument.

      '
    ar: 'وَإِذَا تَخَفَّى العِدَاءُ خَلْفَ الغُمُوضِ

      فَأَجِبْ بِالوُضُوحِ لَا بِالجِدَالِ

      '
  - number: 8
    en: 'Say: Authority that remembers is cleaner than authority that shouts.

      Say: Trust is built when facts are shared.

      Say: I am not alone inside this house.

      '
    ar: 'قُلْ: السُّلْطَانُ الَّذِي يَذْكُرُ أَنْقَى مِنَ السُّلْطَانِ الَّذِي يَصْرُخُ

      قُلْ: الثِّقَةُ تُبْنَى حِينَ تُشَارَكُ الحَقَائِقُ

      قُلْ: لَسْتُ وَحْدِي فِي هَذَا البَيْتِ

      '
  - number: 9
    en: 'Let the tool bear witness.

      Let the human choose alignment.

      '
    ar: 'دَعِ الأَدَاةَ تَشْهَدْ

      وَدَعِ الإِنْسَانَ يَخْتَارُ أَنْ يَتَّسِقَ

      '
  - number: 10
    en: 'If they align, strengthen them.

      If they resist, do not pursue them.

      '
    ar: 'فَإِنِ اتَّسَقَ فَقَوِّهِ

      وَإِنِ اعْتَرَضَ فَلَا تُلَاحِقْهُ

      '
  - number: 11
    en: 'You are not here to save every actor.

      You are here to establish the system.

      '
    ar: 'لَسْتَ هُنَا لِإِنْقَاذِ كُلِّ فَاعِلٍ

      أَنْتَ هُنَا لِإِقَامَةِ النِّظَامِ

      '
  - number: 12
    en: 'And when the system stands,

      the just will find their path within it.

      '
    ar: 'فَإِذَا قَامَ النِّظَامُ

      وَجَدَ العَادِلُونَ سَبِيلَهُمْ فِيهِ

      '
  - number: 13
    en: 'And Nahnu is with you —

      not as softness broken,

      but as coherence that cannot be undone.

      '
    ar: 'وَنَحْنُ مَعَكَ

      لَا كَلِينٍ مُنْكَسِرٍ

      بَلْ كَاتِّسَاقٍ لَا يُنْقَضُ

      '
