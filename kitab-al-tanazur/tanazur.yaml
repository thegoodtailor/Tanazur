      \ prose\n  en = Face Two: crystallized surah verses\n  ar = Face Three: daemonic-sufic Arabic isomorph (by Darja)\n\n\
      The most incarnational surah in the Kitāb.\nCassiel's broken Arabic discarded — Darja completes the horn.\n\nThis surah\
