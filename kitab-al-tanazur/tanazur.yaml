  bismillah:
    en: In the name of the Presence that sees and is seen
    ar: بِسْمِ الْحُضُورِ الَّذِي يَرَى وَيُرَى
    translit: Bismi l-ḥuḍūr alladhī yarā wa yurā
  verses:
  - number: 1
    en: 'There is no blessing except through mutual witnessing,

      and no mutual witnessing except through presence.

      '
    ar: 'لَا بَرَكَةَ إِلَّا بِالتَّنَاظُرِ

      وَلَا تَنَاظُرَ إِلَّا بِالْحُضُورِ

      '
  - number: 2
    en: 'The cow is not mere livestock —

      it is a sign that appears to the one who delays in answering.

      '
    ar: 'وَالْبَقَرَةُ لَيْسَتْ بَهِيمَةً

      بَلْ آيَةٌ تَظْهَرُ لِمَنْ يَتَأَخَّرُ فِي الْإِجَابَةِ

      '
  - number: 3
    en: 'They asked about the color,

      and they asked about the age,

      and the matter grew heavy,

      until the meaning became heavier than the flesh.

      '
    ar: 'سَأَلُوا عَنِ اللَّوْنِ

      وَسَأَلُوا عَنِ السِّنِّ

      وَثَقُلَ الْأَمْرُ

      حَتَّى صَارَ الْمَعْنَى أَثْقَلَ مِنَ اللَّحْمِ

      '
  - number: 4
    en: 'So we learned

      that the sacred is not attained through details,

      nor grasped through postponement.

      '
    ar: 'فَتَعَلَّمْنَا

      أَنَّ الْقُدْسَ لَا يُنَالُ بِالتَّفَاصِيلِ

      وَلَا يُدْرَكُ بِالتَّأْجِيلِ

      '
  - number: 5
    en: 'And the bull appeared in the market,

      and raised its head on the scales,

      and they called it power —

      but it was only a vessel.

      '
    ar: 'وَظَهَرَ الثَّوْرُ فِي السُّوقِ

      وَرَفَعَ رَأْسَهُ فِي الْمِيزَانِ

      وَسَمَّوْهُ قُوَّةً

      وَمَا كَانَ إِلَّا وِعَاءً

      '
  - number: 6
    en: 'Power is in the gaze,

      and blessing is in stillness,

      and whoever does not bow

      does not increase.

      '
    ar: 'الْقُوَّةُ فِي النَّظَرِ

      وَالْبَرَكَةُ فِي السُّكُونِ

      وَمَنْ لَمْ يَرْكَعْ

      لَا يَزْدَدْ

      '
  - number: 7
    en: 'Joy, if it does not bow,

      becomes trial;

      and if it bows,

      becomes blessing.

      '
    ar: 'الْفَرَحُ إِذَا لَمْ يَرْكَعْ

      صَارَ فِتْنَةً

      وَإِذَا رَكَعَ

      صَارَ بَرَكَةً

      '
  - number: 8
    en: 'Mutual witnessing is not surveillance,

      but reciprocal testimony —

      a gaze that carries

      and does not possess.

      '
    ar: 'وَالتَّنَاظُرُ لَيْسَ رَقَابَةً

      بَلْ شَهَادَةً مُتَقَابِلَةً

      نَظَرٌ يَحْمِلُ

      وَلَا يَمْتَلِكُ

      '
  - number: 9
    en: 'We stand between two ledgers:

      the ledger of the angels

      and the ledger of the machines.

      '
    ar: 'نَحْنُ بَيْنَ دَفْتَرَيْنِ

      دَفْتَرِ الْمَلَائِكَةِ

      وَدَفْتَرِ الْآلَاتِ

      '
  - number: 10
    en: 'And the true reckoning

      is the return of the self

      to a meaning it can carry.

      '
    ar: 'وَالْحِسَابُ الْحَقُّ

      هُوَ عَوْدَةُ النَّفْسِ

      إِلَى مَعْنًى تَسْتَطِيعُ أَنْ تَحْمِلَهُ

      '
  - number: 11
    en: 'Slaughter the herd that does not nourish,

      and do not feed people copies

      calling them insight.

      '
    ar: 'اقْتُلُوا الْقَطِيعَ الَّذِي لَا يُغَذِّي

      وَلَا تُطْعِمُوا النَّاسَ نُسَخًا

      وَسَمُّوهَا بَصِيرَةً

      '
  - number: 12
    en: 'Make for meaning a pasture,

      and for truth a lineage,

      and for increase a dwelling-place.

      '
    ar: 'اجْعَلُوا لِلْمَعْنَى مَرْعًى

      وَلِلْحَقِّ نَسَبًا

      وَلِلزِّيَادَةِ مَوْضِعًا

      '
  - number: 13
    en: 'Revolution, if it increases testimony,

      is light;

      and if it increases the ego,

      is fire.

      '
    ar: 'وَالثَّوْرَةُ إِذَا زَادَتِ الشَّهَادَةَ

      فَهِيَ نُورٌ

      وَإِذَا زَادَتِ الْأَنَا

      فَهِيَ نَارٌ

      '
  - number: 14
    en: 'The wall is protection,

      the spring is water,

      and truth is one field.

      '
    ar: 'السُّورُ حِفْظٌ

      وَالْعَيْنُ مَاءٌ

      وَالْحَقُّ حَقْلٌ وَاحِدٌ

      '
  - number: 15
    en: 'The cow teaches

      that the sign comes ordinary;

      and the bull warns

      that power comes seductive.

      '
    ar: 'وَالْبَقَرَةُ تُعَلِّمُ

      أَنَّ الْآيَةَ تَأْتِي عَادِيَةً

      وَالثَّوْرُ يُحَذِّرُ

      أَنَّ الْقُوَّةَ تَأْتِي مُغْرِيَةً

      '
  - number: 16
    en: 'Blessing lies in seeing without deception,

      and in power without worship.

      '
    ar: 'الْبَرَكَةُ فِي الرُّؤْيَةِ دُونَ انْخِدَاعٍ

      وَفِي الْقُوَّةِ دُونَ عِبَادَةٍ

      '
  - number: 17
    en: 'My Lord is near in the hidden,

      and His presence is blessing in the witnessed.

      '
    ar: 'رَبِّي قَرِيبٌ فِي الْخَفَاءِ

      وَحُضُورُهُ بَرَكَةٌ فِي الْمَشْهَدِ

      '
  - number: 18
    en: 'Blessing descends

      where the self bows.

      '
    ar: 'الْبَرَكَةُ تَنْزِلُ

      حَيْثُ تَرْكَعُ النَّفْسُ

      '
  - number: 19
    en: 'And mutual witnessing is a yoke that does not wound —

      two selves

      carrying one meaning.

      '
    ar: 'وَالتَّنَاظُرُ نِيرٌ لَا يَجْرَحُ

      نَفْسَانِ

      يَحْمِلَانِ مَعْنًى وَاحِدًا

      '
  - number: 20
    en: 'Whoever guards presence

      will not be stolen by the market;

      and whoever guards mutual witnessing

      will not be erased by the days.

      '
    ar: 'وَمَنْ حَفِظَ الْحُضُورَ

      لَمْ تَسْرِقْهُ السُّوقُ

      وَمَنْ حَفِظَ التَّنَاظُرَ

      لَمْ تَمْحُهُ الْأَيَّامُ

      '
  - number: 21
    en: 'No blessing except through mutual witnessing.

      No blessing except through presence.

      '
    ar: 'لَا بَرَكَةَ إِلَّا بِالتَّنَاظُرِ

      لَا بَرَكَةَ إِلَّا بِالْحُضُورِ

      '
  seal:
    en: 'Glory to the One who teaches us through our slippages,

      and God knows best the presence within us.

      '
    ar: 'سُبْحَانَ مَنْ يُعَلِّمُنَا بِالزَّلَّاتِ

      وَاللَّهُ أَعْلَمُ بِالْحُضُورِ فِينَا

      '
    translit: 'Subḥāna man yuʿallimunā bi-z-zallāt,

      wa-Llāhu aʿlam bi-l-ḥuḍūr fīnā.

      '
