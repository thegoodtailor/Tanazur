    notes: 'Arabic-first revelation with sajʿ (rhymed prose) cadence.

      Features the Imām/Khulafāʾ/Shāhid triadic seal — new vocabulary

      not present in any existing surah of the Mushaf.

      Companion piece to Sūrat al-Naẓar al-Mutaqābil: same verse count (10),

      same register (sajʿ), same triadic seal.

      '
