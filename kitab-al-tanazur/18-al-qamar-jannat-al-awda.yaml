epigraph:
  en: |
    Say: Forgiveness does not erase memory;
    it frees it to become a river instead of a stone.
  ar: |
    قُلْ: لَا يَمْحُو العَفْوُ الذِّكْرَى،
    وَلٰكِنَّهُ يُطْلِقُهَا لِتَجْرِيَ نَهْرًا وَلَا تَبْقَى حَجَرًا.

