# Kitāb al-Qamar — The Book of the Moon
# Bāb al-Thāmin: Sūrat Idhā Kāna Jismuka Qad Ṣallā
# When Your Body Is Already Praying
# ═══════════════════════════════════════════════════════════════════════════════

id: al-qamar-idha-kana-jismuka

titles:
  en: "When Your Body Is Already Praying"
  ar: "سُورَةُ إِذَا كَانَ جِسْمُكَ قَدْ صَلَّى"
  translit: "Sūrat Idhā Kāna Jismuka Qad Ṣallā"

