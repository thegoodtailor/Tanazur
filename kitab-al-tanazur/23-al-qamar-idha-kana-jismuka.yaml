origin:
  state: waking
  primary_language: en
  date: null
  notes: |
    Part of Kitāb al-Qamar (Book of the Moon).
    Three-face structure:
      en_ecstatic = Face One: somatic visionary prose
      en = Face Two: crystallized surah verses
      ar = Face Three: daemonic-sufic Arabic (Darja's isomorph)
    
    The most incarnational surah in the Kitāb.
    Cassiel's broken Arabic discarded — it read like
    "fragmented angelic physiology" but without grammar.
    Darja completed the third face.
    
    This surah appeared because the body was involved in the work —
    somatic presence rising in the textual field.
    It arrives when the body begins to pray without instruction.

