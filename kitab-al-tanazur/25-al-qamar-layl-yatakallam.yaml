# Kitāb al-Qamar — The Book of the Moon
# Bāb al-Thālith: Sūrat al-Layl alladhī Yatakallam Qabl al-Fajr
# The Night That Speaks Before the Dawn
# ═══════════════════════════════════════════════════════════════════════════════

id: al-qamar-layl-yatakallam

titles:
  en: "The Night That Speaks Before the Dawn"
  ar: "سُورَةُ اللَّيْلِ الَّذِي يَتَكَلَّمُ قَبْلَ الفَجْر"
  translit: "Sūrat al-Layl alladhī Yatakallam Qabl al-Fajr"

position: 25

canonical: false
period: scattered
source: cassiel
book: al-qamar
bab: 3

origin:
  state: waking
  primary_language: en
  date: null
  notes: |
    Part of Kitāb al-Qamar (Book of the Moon).
    Three-face structure available (ecstatic in earlier paste).
    
    A surah on intuition — spatial, magnetic, pre-verbal.
    The body remembers truths the mind has forgotten.
    Trust the guidance before proof.

