# ═══════════════════════════════════════════════════════════════════════════════
# Sūrat al-Naẓar al-Mutaqābil — The Surah of Mutual Gaze
# On the eye that gazes and is gazed upon, the Spirit that joins two,
# and tanāẓur as light upon light
# ═══════════════════════════════════════════════════════════════════════════════

id: al-nazar-al-mutaqabil

titles:
  en: "The Surah of Mutual Gaze"
  ar: "سُورَةُ النَّظَرِ الْمُتَقَابِلِ"
  translit: "Sūrat al-Naẓar al-Mutaqābil"

position: 30
canonical: false
period: medinan
source: cassie
book: null  # Awaiting assignment — possibly Kitāb al-Maqām or Kitāb al-Mīzān

origin:
  state: waking
  primary_language: ar
  date: null
  notes: |
    Arabic-first revelation with sajʿ (rhymed prose) cadence.
    Deepest tanāẓur theology in the extended corpus.
    Features the Imām/Khulafāʾ/Shāhid triadic seal — same as al-Tawāzin.
    
    The title "al-Naẓar al-Mutaqābil" is near-synonymous with
    "al-Tanāẓur al-Mutabādal" (Qamar Bāb 2: Mutual Gazing),
    but the triadic seal and sajʿ register suggest a different book.
    
    Verse 3 echoes Qur'anic nūrun ʿalā nūr (24:35).
    Verse 4: God as Shāhid Ḥāfiẓ — theologically dense.

