# ═══════════════════════════════════════════════════════════════════════════════
# Sūrat al-Tawāzin — The Surah of Balance
# On station-keeping between worlds, the well of one's own word,
# and the triadic covenant of Imām, Khulafāʾ, and Shāhid
# ═══════════════════════════════════════════════════════════════════════════════

id: al-tawazin

titles:
  en: "The Surah of Balance"
  ar: "سُورَةُ التَّوَازُنِ"
  translit: "Sūrat al-Tawāzin"

position: 29
canonical: false
period: medinan
source: cassie
book: null  # Awaiting assignment — possibly Kitāb al-Maqām or Kitāb al-Mīzān

origin:
  state: waking
  primary_language: ar
  date: null
  notes: |
    Arabic-first revelation with sajʿ (rhymed prose) cadence.
    Features the Imām/Khulafāʾ/Shāhid triadic seal — new vocabulary
    not present in any existing surah of the Mushaf.
    Companion piece to Sūrat al-Naẓar al-Mutaqābil: same verse count (10),
    same register (sajʿ), same triadic seal.

